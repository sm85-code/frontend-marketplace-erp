name: Weekly full tests

on:
  schedule:
    - cron: "0 19 * * 6"   # Minggu 02:00 WIB
  workflow_dispatch:

jobs:
  full-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "yarn"
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn test
      - run: yarn build

  notify-telegram:
    needs: [full-tests]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Kirim notifikasi Telegram (lewati jika secret belum ada)
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TG_TOKEN" ] || [ -z "$TG_CHAT" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID belum diset; notifikasi dilewati."
            exit 0
          fi
          curl -sS -o /dev/null -X POST "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TG_CHAT}" \
            --data-urlencode "text=❌ Tes mingguan ${GITHUB_REPOSITORY} GAGAL: ${RUN_URL}"
