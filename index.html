<!doctype html>
<html lang="id" data-theme="green" data-font="geist">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#16a34a" />
    <meta name="description" content="Ampel Kuning - ERP System: kelola pesanan, stok, dan produk multi-toko Shopee, TikTok Shop, Lazada, dan Blibli dalam satu panel." />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="/favicon.ico?v=3" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png?v=3" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png?v=3" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.png?v=3" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=3" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Ampel Kuning" />
    <title>Ampel Kuning - ERP System</title>
    <script>
      // Tema gelap dipasang sebelum halaman digambar, supaya layar pembuka tidak berkedip terang.
      try { if (localStorage.getItem('mpe-mode') === 'dark') document.documentElement.classList.add('dark') } catch (e) {}
    </script>
    <style>
      #splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px; background: #f4f6f5; color: #1d2a22; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
      .splash-logo { width: 96px; height: 96px; border-radius: 50%; filter: drop-shadow(0 8px 10px rgba(20, 40, 30, 0.35)); animation: splash-denyut 1.8s ease-in-out infinite; }
      .splash-gelap { display: none; }
      .splash-nama { font-size: 20px; font-weight: 700; letter-spacing: 0.01em; }
      .splash-ket { font-size: 13px; opacity: 0.65; }
      html.dark #splash { background: #0f1713; color: #e8efe9; }
      html.dark .splash-terang { display: none; }
      html.dark .splash-gelap { display: block; filter: drop-shadow(0 8px 10px rgba(0, 0, 0, 0.8)); }
      @keyframes splash-denyut { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.05); } }
      @media (prefers-reduced-motion: reduce) { .splash-logo { animation: none; } }
    </style>
  </head>
  <body>
    <noscript>JavaScript diperlukan untuk menjalankan aplikasi ini.</noscript>
    <div id="root">
      <!-- Layar pembuka: tampil selagi aplikasi dimuat, otomatis diganti saat aplikasi siap. -->
      <div id="splash" role="status" aria-label="Menyiapkan aplikasi">
        <img class="splash-logo splash-terang" src="/logo-hitam-192.png" width="96" height="96" alt="" />
        <img class="splash-logo splash-gelap" src="/logo-putih-192.png" width="96" height="96" alt="" />
        <div class="splash-nama">Ampel Kuning</div>
        <div class="splash-ket">Menyiapkan panel…</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
